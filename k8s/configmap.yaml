apiVersion: v1
kind: ConfigMap
metadata:
  name: astrogea-config
  namespace: astrogea
data:
  # Dask Configuration
  dask-scheduler.yaml: |
    distributed:
      dashboard:
        link: "/proxy/{port}/status"
      worker:
        memory:
          target: 0.8
          spill: 0.9
          pause: 0.95
          terminate: 0.98
        nanny:
          terminate-timeout: 30s
      comm:
        timeout: 60s
        retry: 3
      admin:
        tick:
          limit: 3s
          interval: 1s
  
  # Storage Configuration
  storage-config.yaml: |
    local:
      base_path: "/data/local"
      cache_size: "1GB"
    s3:
      endpoint_url: null
      aws_access_key_id: null
      aws_secret_access_key: null
      bucket_name: null
      region: "us-east-1"
    gcs:
      project_id: null
      bucket_name: null
      credentials_path: null
    azure:
      account_name: null
      account_key: null
      container_name: null
  
  # Processing Configuration
  processing-config.yaml: |
    default_chunks:
      line: "auto"
      sample: "auto"
      wavelength: -1
    memory_limit: "4GB"
    cpu_limit: "2"
    timeout: 3600
    retry_attempts: 3
  
  # Logging Configuration
  logging-config.yaml: |
    version: 1
    disable_existing_loggers: false
    formatters:
      standard:
        format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
      detailed:
        format: "%(asctime)s [%(levelname)s] %(name)s:%(lineno)d: %(message)s"
    handlers:
      console:
        class: logging.StreamHandler
        level: INFO
        formatter: standard
        stream: ext://sys.stdout
      file:
        class: logging.handlers.RotatingFileHandler
        level: DEBUG
        formatter: detailed
        filename: /var/log/astrogea/astrogea.log
        maxBytes: 10485760
        backupCount: 5
    loggers:
      astrogea:
        level: DEBUG
        handlers: [console, file]
        propagate: false
      dask:
        level: INFO
        handlers: [console]
        propagate: false
    root:
      level: INFO
      handlers: [console]
